<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;700&amp;display=swap');
            .title-text {
                font-family: 'Geist', sans-serif;
            }
        </style>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#05070a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
        </linearGradient>
        <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="60%" style="stop-color:#66aaff;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:#66aaff;stop-opacity:0" />
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Latar Belakang -->
    <rect width="1200" height="600" fill="url(#bgGradient)" />

    <!-- Bintang-bintang Kecil -->
    <g fill="white">
        <circle cx="100" cy="80" r="1.5" opacity="0.8"/>
        <circle cx="250" cy="150" r="1" opacity="0.6"/>
        <circle cx="500" cy="50" r="2" opacity="0.9"/>
        <circle cx="800" cy="120" r="1.5" opacity="0.7"/>
        <circle cx="1100" cy="90" r="1" opacity="0.5"/>
        <circle cx="150" cy="450" r="1.5" opacity="0.8"/>
        <circle cx="400" cy="550" r="2" opacity="0.9"/>
        <circle cx="950" cy="300" r="1" opacity="0.6"/>
        <circle cx="1150" cy="500" r="1.5" opacity="0.7"/>
        <circle cx="600" cy="350" r="1.5" opacity="0.5"/>
    </g>

    <!-- Nebula/Debu Kosmis -->
    <path d="M300,300 C400,100 600,100 700,300 C800,500 600,500 500,450 C400,400 200,500 300,300 Z" fill="#8844aa" opacity="0.15" filter="url(#glow)"/>
    <path d="M750,200 C850,50 1050,150 1000,350 C950,550 750,450 800,350 C850,250 650,100 750,200 Z" fill="#4466aa" opacity="0.1" filter="url(#glow)"/>

    <!-- Logo (Gaya Galaksi/Orbit) - Tanpa Teks -->
    <g transform="translate(600, 270)">
        <!-- Lingkaran Orbit -->
        <circle cx="0" cy="0" r="80" stroke="#66aaff" stroke-width="2" fill="none" opacity="0.5"/>
        <circle cx="0" cy="0" r="110" stroke="#4466aa" stroke-width="1" fill="none" opacity="0.3"/>
        
        <!-- Bintang Pusat Logo -->
        <circle cx="0" cy="0" r="15" fill="#ffffff" filter="url(#glow)"/>
        
        <!-- Orbiting Particle -->
        <circle cx="80" cy="0" r="5" fill="#66aaff" filter="url(#glow)">
            <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Title "Beyond The Void" dengan Font Geist -->
    <text class="title-text" x="600" y="480" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
        Beyond The Void
    </text>
    
    <!-- Garis Hiasan Bawah -->
    <line x1="450" y1="510" x2="750" y2="510" stroke="#66aaff" stroke-width="2" opacity="0.7"/>

</svg>